<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | CNV AUDIO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; background: #f3f4f6; color: #1f2937; }</style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-2xl bg-white p-8 rounded-xl shadow-xl border border-gray-200">
        <div class="mb-8 border-b border-gray-200 pb-4">
            <h2 class="text-3xl font-bold text-gray-900 font-['Rajdhani']">Upload New Device</h2>
            <p class="text-gray-500 text-sm">Add items to the public catalog instantly.</p>
        </div>

        <form id="product-form" class="space-y-5">
            <div>
                <label class="block text-gray-700 text-sm font-semibold mb-2">Product Name</label>
                <input type="text" id="p-name" required class="w-full p-3 bg-gray-50 rounded border border-gray-300 focus:outline-none focus:border-blue-500 transition">
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-700 text-sm font-semibold mb-2">Price (LKR)</label>
                    <input type="text" id="p-price" required placeholder="Rs. 45,000" class="w-full p-3 bg-gray-50 rounded border border-gray-300 focus:border-blue-500 transition">
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-semibold mb-2">Upload Image</label>
                    <input type="file" id="p-image-file" accept="image/*" required class="w-full p-2 bg-gray-50 rounded border border-gray-300 focus:border-blue-500 transition">
                </div>
            </div>

            <div>
                <label class="block text-gray-700 text-sm font-semibold mb-2">Short Description</label>
                <textarea id="p-desc" required rows="3" class="w-full p-3 bg-gray-50 rounded border border-gray-300 focus:border-blue-500 transition"></textarea>
            </div>

            <div>
                <label class="block text-gray-700 text-sm font-semibold mb-2">Specifications (Comma separated)</label>
                <input type="text" id="p-specs" required placeholder="1200W, 4 Channel, Bluetooth 5.0" class="w-full p-3 bg-gray-50 rounded border border-gray-300 focus:border-blue-500 transition">
            </div>

            <div id="progress-container" class="hidden w-full bg-gray-200 rounded-full h-2.5">
                <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full" style="width: 0%"></div>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg mt-4 transition shadow-md">Upload to Store</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAx-Zv0iK_P25XK9rcly_t1fLJv_-xyY2I",
            authDomain: "cnv-audio.firebaseapp.com",
            projectId: "cnv-audio",
            storageBucket: "cnv-audio.firebasestorage.app", // Make sure this matches your config
            messagingSenderId: "981917537038",
            appId: "1:981917537038:web:e79ffa1b5d2ed75af0fd5f",
            measurementId: "G-T3T30E7KJJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        const productForm = document.getElementById('product-form');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');

        productForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = productForm.querySelector('button[type="submit"]');
            
            // 1. Get File
            const file = document.getElementById('p-image-file').files[0];
            if (!file) return alert("Please select an image");

            submitBtn.innerText = "Uploading Image...";
            submitBtn.disabled = true;
            progressContainer.classList.remove('hidden');
            progressBar.style.width = '30%';

            try {
                // 2. Upload Image to Firebase Storage
                const storageRef = ref(storage, 'products/' + Date.now() + '_' + file.name);
                await uploadBytes(storageRef, file);
                progressBar.style.width = '70%';
                
                // 3. Get Image URL
                const imageUrl = await getDownloadURL(storageRef);
                
                // 4. Save Data to Firestore
                submitBtn.innerText = "Saving Data...";
                const specsArray = document.getElementById('p-specs').value.split(',').map(s => s.trim());
                
                await addDoc(collection(db, "products"), {
                    name: document.getElementById('p-name').value,
                    price: document.getElementById('p-price').value,
                    image: imageUrl, // Saved the uploaded URL
                    description: document.getElementById('p-desc').value,
                    specs: specsArray,
                    createdAt: new Date()
                });

                progressBar.style.width = '100%';
                alert("Product Added Successfully!");
                productForm.reset();
                progressContainer.classList.add('hidden');
                progressBar.style.width = '0%';

            } catch (error) {
                console.error("Error: ", error);
                alert("Error: " + error.message);
            }
            submitBtn.innerText = "Upload to Store";
            submitBtn.disabled = false;
        });
    </script>
</body>
</html>
