<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | CNV AUDIO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Rajdhani', sans-serif; background: #0a0a0a; color: white; }</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="auth-container" class="w-full max-w-md bg-gray-900 p-8 rounded-xl border border-gray-800 shadow-2xl">
        <h2 class="text-3xl font-bold text-cyan-400 mb-6 text-center">Admin Login</h2>
        <input type="email" id="email" placeholder="Admin Email" class="w-full mb-4 p-3 bg-gray-800 rounded border border-gray-700 text-white focus:outline-none focus:border-cyan-400">
        <input type="password" id="password" placeholder="Password" class="w-full mb-6 p-3 bg-gray-800 rounded border border-gray-700 text-white focus:outline-none focus:border-cyan-400">
        <button id="login-btn" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 rounded transition">Login Dashboard</button>
    </div>

    <div id="dashboard-container" class="w-full max-w-2xl bg-gray-900 p-8 rounded-xl border border-gray-800 shadow-2xl hidden">
        <div class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
            <h2 class="text-3xl font-bold text-white">Add New Device</h2>
            <button id="logout-btn" class="text-red-400 hover:text-red-300 text-sm">Logout</button>
        </div>

        <form id="product-form" class="space-y-4">
            <div>
                <label class="block text-gray-400 text-sm mb-1">Product Name</label>
                <input type="text" id="p-name" required class="w-full p-3 bg-gray-800 rounded border border-gray-700 focus:border-cyan-400">
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-400 text-sm mb-1">Price (LKR)</label>
                    <input type="text" id="p-price" required placeholder="e.g. Rs. 45,000" class="w-full p-3 bg-gray-800 rounded border border-gray-700 focus:border-cyan-400">
                </div>
                <div>
                    <label class="block text-gray-400 text-sm mb-1">Image URL</label>
                    <input type="url" id="p-image" required placeholder="https://example.com/image.jpg" class="w-full p-3 bg-gray-800 rounded border border-gray-700 focus:border-cyan-400">
                </div>
            </div>

            <div>
                <label class="block text-gray-400 text-sm mb-1">Short Description</label>
                <textarea id="p-desc" required rows="3" class="w-full p-3 bg-gray-800 rounded border border-gray-700 focus:border-cyan-400"></textarea>
            </div>

            <div>
                <label class="block text-gray-400 text-sm mb-1">Specifications (Comma separated)</label>
                <input type="text" id="p-specs" required placeholder="1200W, 4 Channel, Bluetooth 5.0" class="w-full p-3 bg-gray-800 rounded border border-gray-700 focus:border-cyan-400">
            </div>

            <button type="submit" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded mt-4 transition">Upload to Store</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAx-Zv0iK_P25XK9rcly_t1fLJv_-xyY2I",
            authDomain: "cnv-audio.firebaseapp.com",
            projectId: "cnv-audio",
            storageBucket: "cnv-audio.firebasestorage.app",
            messagingSenderId: "981917537038",
            appId: "1:981917537038:web:e79ffa1b5d2ed75af0fd5f",
            measurementId: "G-T3T30E7KJJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // UI Elements
        const authContainer = document.getElementById('auth-container');
        const dashboardContainer = document.getElementById('dashboard-container');
        const productForm = document.getElementById('product-form');

        // Check Auth State
        onAuthStateChanged(auth, (user) => {
            if (user) {
                authContainer.classList.add('hidden');
                dashboardContainer.classList.remove('hidden');
            } else {
                authContainer.classList.remove('hidden');
                dashboardContainer.classList.add('hidden');
            }
        });

        // Login Function
        document.getElementById('login-btn').addEventListener('click', () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            signInWithEmailAndPassword(auth, email, pass).catch(err => alert("Login Failed: " + err.message));
        });

        // Logout Function
        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

        // Add Product Function
        productForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = productForm.querySelector('button[type="submit"]');
            submitBtn.innerText = "Uploading...";
            submitBtn.disabled = true;

            const specsArray = document.getElementById('p-specs').value.split(',').map(s => s.trim());

            try {
                await addDoc(collection(db, "products"), {
                    name: document.getElementById('p-name').value,
                    price: document.getElementById('p-price').value,
                    image: document.getElementById('p-image').value,
                    description: document.getElementById('p-desc').value,
                    specs: specsArray,
                    createdAt: new Date()
                });
                alert("Product Added Successfully!");
                productForm.reset();
            } catch (error) {
                console.error("Error adding document: ", error);
                alert("Error adding product. Check console.");
            }
            submitBtn.innerText = "Upload to Store";
            submitBtn.disabled = false;
        });
    </script>
</body>
  </html>
